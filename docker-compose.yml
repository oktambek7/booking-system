services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - booking_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-before-deploy}
      BUSINESS_TIMEZONE: Asia/Tashkent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  booking_db:
