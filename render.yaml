services:
  - type: web
    name: parda-cinema-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: TMDB_READ_TOKEN
        sync: false
      - key: TMDB_MAX_PAGES
        value: "5"
      - key: TMDB_SYNC_INTERVAL_HOURS
        value: "24"
      - key: SMS_MODE
        value: mock
      - key: SMS_EMAIL
        sync: false
      - key: SMS_PASSWORD
        sync: false
      - key: EMAIL_MODE
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
